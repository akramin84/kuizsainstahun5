<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Sains Tahun 5: Unit 2 Manusia</title>
    <style>
        :root {
            --primary: #008080;
            --secondary: #ffdab9;
            --dark: #2d3748;
            --light: #f7fafc;
            --success: #48bb78;
            --danger: #f56565;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .option-label {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .option-label:hover {
            background-color: #f7fafc;
            border-color: var(--primary);
        }
        input[type="radio"] {
            margin-right: 12px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #006666;
        }
        #result-section {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .score-display {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kuiz Sains Tahun 5 <br><small>Unit 2: Manusia (50 Soalan)</small></h1>
    <hr>
    
    <div id="auth-section">
        <h3>Maklumat Murid</h3>
        <div class="form-group">
            <label for="student-name">Nama Penuh Murid:</label>
            <input type="text" id="student-name" placeholder="Contoh: Muhammad Ali">
        </div>
        <div class="form-group">
            <label for="student-class">Kelas:</label>
            <input type="text" id="student-class" placeholder="Contoh: 5 Bijak">
        </div>
        <button class="btn" onclick="startQuiz()">Mula Jawab Kuiz</button>
    </div>

    <div id="quiz-section" style="display:none;">
        <div id="questions-container"></div>
        <button class="btn" onclick="gradeQuiz()">Hantar Semua Jawapan</button>
    </div>

    <div id="result-section">
        <h2>Tahniah, Sesi Jawab Selesai!</h2>
        <div class="score-display" id="score-text">0 / 50</div>
        <p>Sila tekan butang di bawah untuk menghantar keputusan anda terus ke Telegram Cikgu.</p>
        <button class="btn" id="send-tele-btn" onclick="sendToTelegram()">Hantar Markah ke Telegram Cikgu</button>
        <p id="status-msg" style="margin-top:15px; font-weight:bold;"></p>
    </div>
</div>

        { q: "Apakah fungsi sel darah putih di dalam sistem peredaran darah?", o: ["Melawan jangkitan penyakit dan bakteria", "Mengangkut gas oksigen", "Membekukan luka", "Menyerap zat besi"], a: 0 },
        { q: "Apakah fungsi komponen platelet (kepingan darah)?", o: ["Membantu pembekuan darah semasa luka", "Mengangkut hormon", "Melindungi otak", "Menggerakkan sendi engsel"], a: 0 },
        { q: "Manakah sistem yang membekalkan tenaga asas, yang kemudiannya diedarkan oleh sistem peredaran darah?", o: ["Sistem pencernaan", "Sistem rangka", "Sistem perkumuhan", "Sistem pembiakan"], a: 0 },
        { q: "Apakah kesan buruk sekiranya salur darah arteri koronari pada jantung tersumbat?", o: ["Serangan jantung (otot jantung kekurangan oksigen)", "Patah tulang rusuk", "Sistem pencernaan menjadi terlalu laju", "Otak menghasilkan kalsium"], a: 0 },
        { q: "Mengapakah anatomi manusia dianggap sebagai satu sistem yang saling bergantung?", o: ["Kegagalan satu sistem akan menjejaskan fungsi sistem yang lain", "Setiap sistem bekerja asing tanpa kaitan", "Manusia boleh hidup tanpa peredaran darah", "Sistem rangka boleh menggantikan fungsi peparu"], a: 0 }
    ];

    let markah = 0;
    let namaMurid = "";
    let kelasMurid = "";

    function startQuiz() {
        namaMurid = document.getElementById("student-name").value.trim();
        kelasMurid = document.getElementById("student-class").value.trim();

        if (namaMurid === "" || kelasMurid === "") {
            alert("Sila masukkan Nama dan Kelas terlebih dahulu!");
            return;
        }

        document.getElementById("auth-section").style.display = "none";
        document.getElementById("quiz-section").style.display = "block";

        renderQuestions();
    }

    function renderQuestions() {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        bankSoalan.forEach((item, index) => {
            let optionsHtml = "";
            item.o.forEach((opt, oIndex) => {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${oIndex}">
                        ${opt}
                    </label>
                `;
            });

            container.innerHTML += `
                <div class="question-card">
                    <div class="question-text">Soalan ${index + 1}: ${item.q}</div>
                    <div class="options-container">${optionsHtml}</div>
                </div>
            `;
        });
    }

    function gradeQuiz() {
        markah = 0;
        let semuaDijawab = true;

        bankSoalan.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (!selected) {
                semuaDijawab = false;
            } else {
                if (parseInt(selected.value) === item.a) {
                    markah++;
                }
            }
        });

        if (!semuaDijawab) {
            const sahkan = confirm("Ada soalan yang belum dijawab. Anda pasti mahu hantar?");
            if (!sahkan) return;
        }

        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";
        document.getElementById("score-text").innerText = `${markah} / 50`;
    }

    function sendToTelegram() {
        const btn = document.getElementById("send-tele-btn");
        const status = document.getElementById("status-msg");
        
        btn.disabled = true;
        status.innerText = "Sedang menghantar markah...";
        status.style.color = "orange";

        // Format mesej yang kemas untuk masuk ke Telegram Cikgu
        const textMessage = `📌 *KEPUTUSAN KUIZ SAINS T5*\n\n` +
                            `👤 *Nama:* ${namaMurid}\n` +
                            `🏫 *Kelas:* ${kelasMurid}\n` +
                            `📊 *Markah:* ${markah} / 50\n` +
                            `📈 *Peratus:* ${(markah/50*100).toFixed(2)}%\n` +
                            `📅 *Tarikh:* ${new Date().toLocaleString('ms-MY')}`;

        const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage`;
        
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: TELE_CHAT_ID,
                text: textMessage,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.ok) {
                status.innerText = "✅ Markah berjaya dihantar terus ke Telegram Cikgu!";
                status.style.color = "green";
                btn.innerText = "Sudah Dihantar";
            } else {
                status.innerText = "❌ Gagal menghantar. Sila tangkap layar (screenshot) markah anda.";
                status.style.color = "red";
                btn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            status.innerText = "❌ Ralat Rangkaian. Sila pastikan anda mempunyai akses internet semasa menghantar.";
            status.style.color = "red";
            btn.disabled = false;
        });
    }
</script>
